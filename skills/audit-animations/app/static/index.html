<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audit-animations checklist</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>audit-animations</h1>
  <p id="site"></p>
  <div id="counts"></div>
</header>
<div id="filters">
  <label><input type="checkbox" value="composited" checked> Composited</label>
  <label><input type="checkbox" value="runtime" checked> Runtime</label>
  <label><input type="checkbox" value="safari-risk" checked> Safari-risk</label>
  <select id="page"><option value="">Todas las páginas</option></select>
  <select id="severity">
    <option value="">Todas las severidades</option>
    <option value="critical">Critical</option>
    <option value="high">High</option>
    <option value="medium">Medium</option>
    <option value="low">Low</option>
    <option value="info">Info</option>
  </select>
  <label><input type="checkbox" id="hide-resolved"> Ocultar resueltos</label>
  <select id="sort"><option value="severity">Orden: peor primero</option><option value="page">Orden: por página A-Z</option></select>
</div>
<main id="list"></main>
<script src="/app.js"></script>
</body>
</html>
